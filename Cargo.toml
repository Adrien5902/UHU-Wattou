[workspace]
default-members = ["crates/bot"]
members = ["crates/bot"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serenity = "0.12.4"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
dotenv = "0.15"
poise = "0.6.1"
time = { version = "0.3.48", features = ["parsing", "macros", "local-offset"] }
ics = "0.5.8"
uuid = { version = "1.23.3", features = ["v4"] }
once_cell = "1.21.4"
thiserror = "2.0.18"
bitflags = { version = "2.13.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
color-eyre = "0.6.5"
